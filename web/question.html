<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta name="description" content="知乎问题详情模拟页，用于体验问题探索地图插件。">
  <title>知乎模拟站 · 问题</title>
  <link rel="stylesheet" href="/web/vendor/katex/katex.min.css">
  <link rel="stylesheet" href="/web/styles.css?v=20260915.10">
  <link rel="stylesheet" href="/web/collision.css">
</head>
<body data-page="question">
  <header class="topbar">
    <div class="topbar-inner">
      <a class="zh-logo" href="/" aria-label="知乎首页">知乎</a>
      <nav class="main-nav" aria-label="主导航"><a href="#">关注</a><a href="/">推荐</a><a href="#">热榜</a><a href="#">专栏</a><a href="#">圈子</a><a href="#">AI Works <sup>Beta</sup></a></nav>
      <label class="search"><span class="sr-only">搜索</span><input placeholder="搜索问题和答案" aria-label="搜索"><button type="button" aria-label="提交搜索">⌕</button></label>
      <div class="header-tools">
        <button class="usage-guide-button" type="button" data-onboarding-open><i aria-hidden="true">?</i><span>使用说明</span></button>
        <div class="collision-quota" id="collisionQuota" aria-label="今日碰撞剩余次数"><span>今日剩余</span><strong>-- 次</strong></div>
        <button class="auth-button" id="authButton" type="button">知乎登录</button>
      </div>
    </div>
  </header>
  <section id="questionHeader" class="question-header"></section>
  <main class="page-shell question-layout">
    <section class="answers-column">
      <div class="answer-count card" id="answerCount"></div>
      <div id="answers"></div>
    </section>
  </main>
  <script src="/web/vendor/katex/katex.min.js"></script>
  <script src="/content/data.js"></script>
  <script src="/web/site.js?v=20260915.10"></script>
  <script src="/content/collision-maps.js"></script>
  <script src="/web/collision-core.js"></script>
  <script src="/web/collision.js"></script>
</body>
</html>
